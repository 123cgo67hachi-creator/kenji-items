<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタログ管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: white;
  padding: 1.5rem 1rem;
  text-align: center;
}
.header h1 { font-size: 1.2rem; }
.container { max-width: 500px; margin: 0 auto; padding: 1rem; }

.setup-card, .form-card {
  background: white;
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: #666;
  margin-bottom: 0.3rem;
  margin-top: 1rem;
}
label:first-child { margin-top: 0; }

input[type="text"], input[type="url"], select {
  width: 100%;
  padding: 0.7rem;
  border: 1.5px solid #e5e5ea;
  border-radius: 10px;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: #0f3460; }

/* 商品名のキーワード検索（旧: select） */
.combo-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: #888;
}
.combo-tools .chk {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  margin: 0;
  font-size: 0.75rem;
  font-weight: 500;
  color: #666;
  cursor: pointer;
}
.combo-tools .chk input { width: auto; }
.product-list {
  margin-top: 0.4rem;
  border: 1.5px solid #e5e5ea;
  border-radius: 10px;
  max-height: 240px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.product-item {
  padding: 0.65rem 0.75rem;
  font-size: 0.9rem;
  border-bottom: 1px solid #f0f0f2;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.product-item:last-child { border-bottom: none; }
.product-item:active, .product-item.active { background: #f0f4ff; }
.product-item .flag {
  flex-shrink: 0;
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 4px;
  background: #f0f0f2;
  color: #999;
}
.product-item .flag.done { background: #d4edda; color: #155724; }
.product-empty {
  padding: 1rem 0.75rem;
  font-size: 0.85rem;
  color: #999;
  text-align: center;
}
.btn-new {
  width: 100%;
  margin-top: 0.5rem;
  padding: 0.6rem;
  border: 1.5px dashed #ccc;
  border-radius: 10px;
  background: white;
  color: #0f3460;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.selected-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.7rem;
  border: 1.5px solid #0f3460;
  border-radius: 10px;
  background: #f0f4ff;
  font-size: 0.95rem;
  font-weight: 600;
}
.chip-clear {
  flex-shrink: 0;
  border: none;
  background: none;
  color: #0f3460;
  font-size: 1.2rem;
  line-height: 1;
  padding: 0 0.2rem;
  cursor: pointer;
}

.dropzone {
  border: 2px dashed #ccc;
  border-radius: 12px;
  padding: 2rem 1rem;
  text-align: center;
  color: #999;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-top: 0.3rem;
}
.dropzone.dragover { border-color: #0f3460; background: #f0f4ff; }
.dropzone.has-file { border-color: #34c759; background: #f0fff4; color: #333; }
.dropzone img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 0.5rem; }

.btn {
  width: 100%;
  padding: 0.85rem;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 1.5rem;
  transition: opacity 0.2s;
}
.btn:active { opacity: 0.7; }
.btn-primary { background: #0f3460; color: white; }
.btn-save { background: #34c759; color: white; }
.btn:disabled { background: #ccc; cursor: not-allowed; }

.status {
  text-align: center;
  padding: 1rem;
  font-size: 0.85rem;
  border-radius: 10px;
  margin-top: 1rem;
  display: none;
}
.status.success { display: block; background: #d4edda; color: #155724; }
.status.error { display: block; background: #f8d7da; color: #721c24; }
.status.loading { display: block; background: #fff3cd; color: #856404; }

.token-hint {
  font-size: 0.7rem;
  color: #999;
  margin-top: 0.3rem;
  line-height: 1.4;
}

.sync-only {
  text-align: center;
  margin-top: 0.5rem;
}
.sync-only a {
  color: #0f3460;
  font-size: 0.8rem;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="header">
  <h1>カタログ管理</h1>
</div>

<div class="container">
  <!-- Token Setup (初回のみ) -->
  <div class="setup-card" id="setupCard" style="display:none;">
    <label>GitHub Token</label>
    <input type="text" id="tokenInput" placeholder="ghp_xxxx または gho_xxxx">
    <p class="token-hint">
      GitHub CLIで <code>gh auth token</code> を実行して取得できます。<br>
      一度保存すれば次回から不要です。
    </p>
    <button class="btn btn-save" onclick="saveToken()">保存</button>
  </div>

  <!-- Main Form -->
  <div class="form-card" id="mainForm" style="display:none;">
    <label>商品名</label>
    <div id="comboBox">
      <input type="text" id="productSearch" placeholder="キーワードで検索（例: 加湿器、シェイバー）" autocomplete="off">
      <div class="combo-tools">
        <label class="chk"><input type="checkbox" id="onlyUnset"> リンク未設定のみ</label>
        <span id="comboCount"></span>
      </div>
      <div class="product-list" id="productList"></div>
      <button type="button" class="btn-new" onclick="addNewProduct()">＋ 新しい商品を追加</button>
    </div>
    <div class="selected-chip" id="selectedChip" style="display:none;">
      <span id="selectedName"></span>
      <button type="button" class="chip-clear" onclick="clearSelection()" title="選び直す">&times;</button>
    </div>

    <label>TikTokショップ アフィリエイトURL</label>
    <input type="url" id="tiktokUrl" placeholder="https://vt.tiktok.com/xxxxx">

    <label>楽天アフィリエイトURL</label>
    <input type="url" id="rakutenUrl" placeholder="https://a.r10.to/xxxxx">

    <label>表示順（任意）</label>
    <input type="text" id="displayOrder" placeholder="1 = 一番上。空欄なら自動（おすすめ順）。clear で解除">

    <label>サムネイル画像</label>
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      タップして画像を選択<br>またはドラッグ＆ドロップ
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <button class="btn btn-primary" id="submitBtn" onclick="submit()">送信</button>

    <div class="sync-only">
      <a href="#" onclick="syncOnly(); return false;">画像なしで同期だけ実行</a>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
const REPO = '123cgo67hachi-creator/kenji-items';
const REPO_API = `https://api.github.com/repos/${REPO}`;

let selectedFile = null;
let allProducts = [];
let filteredProducts = [];
let selectedProduct = null;
let activeIndex = -1;

// Token management
function getToken() { return localStorage.getItem('gh_token'); }
function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('gh_token', t);
  init();
}

function authHeaders() {
  return {
    'Authorization': `Bearer ${getToken()}`,
    'Accept': 'application/vnd.github.v3+json'
  };
}

// Init
async function init() {
  const token = getToken();
  if (!token) {
    document.getElementById('setupCard').style.display = 'block';
    document.getElementById('mainForm').style.display = 'none';
    return;
  }
  document.getElementById('setupCard').style.display = 'none';
  document.getElementById('mainForm').style.display = 'block';
  await loadProducts();
}

// Load product list from current index.html's embedded JSON
// index.html は毎朝5:30(JST)のsync.ymlがNotionから再生成する。ここは常に最新を読む
async function loadProducts() {
  try {
    const resp = await fetch(`index.html?t=${Date.now()}`, { cache: 'no-store' });
    const html = await resp.text();
    const match = html.match(/const products = (\[.*?\]);/s);
    if (match) {
      allProducts = JSON.parse(match[1]);
    }
  } catch (e) {
    console.error('Failed to load products:', e);
  }
  renderProductList();
}

// 検索用の正規化：全角/半角・大文字小文字・カタカナ/ひらがな・記号や空白の差を吸収する。
// 商品名は表記ゆれが多く、「ぼうちゅう」でも「防虫」以外の候補を拾えるようにするため。
function normalizeKey(s) {
  return (s || '')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s　ー・\-_,、.。/()（）\[\]【】]/g, '');
}

// スペース区切りは AND 検索（例:「防虫 器」）
function matchesQuery(name, query) {
  const terms = (query || '').trim().split(/[\s　]+/).map(normalizeKey).filter(Boolean);
  if (!terms.length) return true;
  const key = normalizeKey(name);
  return terms.every(t => key.includes(t));
}

function hasLink(p) { return !!(p.rakuten_url || p.tiktok_url); }

function renderProductList() {
  const q = document.getElementById('productSearch').value;
  const onlyUnset = document.getElementById('onlyUnset').checked;
  const listEl = document.getElementById('productList');
  const countEl = document.getElementById('comboCount');

  filteredProducts = allProducts
    .filter(p => (onlyUnset ? !hasLink(p) : true))
    .filter(p => matchesQuery(p.name, q));

  countEl.textContent = `${filteredProducts.length} / ${allProducts.length} 件`;
  activeIndex = -1;
  listEl.innerHTML = '';

  if (!filteredProducts.length) {
    const empty = document.createElement('div');
    empty.className = 'product-empty';
    empty.textContent = allProducts.length ? '該当なし。別のキーワードで試してください' : '商品リストを読み込めませんでした';
    listEl.appendChild(empty);
    return;
  }

  filteredProducts.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'product-item';
    row.dataset.index = i;

    const flag = document.createElement('span');
    flag.className = 'flag' + (hasLink(p) ? ' done' : '');
    flag.textContent = hasLink(p) ? '設定済' : '未設定';

    const label = document.createElement('span');
    label.textContent = p.name;  // 商品名はNotion由来。textContentでHTMLとして解釈させない

    row.appendChild(flag);
    row.appendChild(label);
    row.addEventListener('click', () => selectProduct(p));
    listEl.appendChild(row);
  });
}

function setActive(i) {
  const rows = document.querySelectorAll('#productList .product-item');
  if (!rows.length) return;
  activeIndex = Math.max(0, Math.min(rows.length - 1, i));
  rows.forEach(r => r.classList.remove('active'));
  const el = rows[activeIndex];
  el.classList.add('active');
  el.scrollIntoView({ block: 'nearest' });
}

function selectProduct(p) {
  selectedProduct = p.name;
  document.getElementById('selectedName').textContent = p.name;
  document.getElementById('selectedChip').style.display = 'flex';
  document.getElementById('comboBox').style.display = 'none';
  // 既存のリンクがあれば初期値として入れる（上書きしたいときはそのまま編集）
  document.getElementById('rakutenUrl').value = p.rakuten_url || '';
  document.getElementById('tiktokUrl').value = p.tiktok_url || '';
  document.getElementById('displayOrder').value = (p.order === null || p.order === undefined) ? '' : p.order;
}

function clearSelection() {
  selectedProduct = null;
  document.getElementById('selectedChip').style.display = 'none';
  document.getElementById('comboBox').style.display = 'block';
  const search = document.getElementById('productSearch');
  search.value = '';
  renderProductList();
  search.focus();
}

function addNewProduct() {
  const name = prompt('商品名を入力:', document.getElementById('productSearch').value.trim());
  if (!name || !name.trim()) return;
  selectProduct({ name: name.trim(), rakuten_url: '', tiktok_url: '', order: null });
}

document.getElementById('productSearch').addEventListener('input', renderProductList);
document.getElementById('onlyUnset').addEventListener('change', renderProductList);
document.getElementById('productSearch').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    const i = activeIndex >= 0 ? activeIndex : 0;
    if (filteredProducts[i]) selectProduct(filteredProducts[i]);
  }
});

// Drag & drop
const dz = document.getElementById('dropzone');
const fi = document.getElementById('fileInput');

dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});
fi.addEventListener('change', () => { if (fi.files[0]) handleFile(fi.files[0]); });

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  selectedFile = file;
  dz.classList.add('has-file');
  dz.innerHTML = `<strong>${file.name}</strong> (${(file.size/1024).toFixed(0)}KB)`;
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  dz.appendChild(img);
}

// Show status
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

// Upload image to repo
async function uploadImage(name, file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const safeName = name.replace(/[^a-zA-Z0-9　-鿿豈-﫿]/g, '_');
  const filename = `${safeName}.${ext}`;
  const path = `images/${filename}`;

  const buf = await file.arrayBuffer();
  const base64 = btoa(new Uint8Array(buf).reduce((s, b) => s + String.fromCharCode(b), ''));

  let sha = null;
  try {
    const existing = await fetch(`${REPO_API}/contents/${path}`, { headers: authHeaders() });
    if (existing.ok) {
      const data = await existing.json();
      sha = data.sha;
    }
  } catch (e) {}

  const body = {
    message: `Add image: ${filename}`,
    content: base64,
  };
  if (sha) body.sha = sha;

  const resp = await fetch(`${REPO_API}/contents/${path}`, {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!resp.ok) throw new Error(`Image upload failed: ${resp.status}`);
  return filename;
}

// Trigger sync workflow
async function triggerSync(productName, rakutenUrl, tiktokUrl, imageFilename, displayOrder) {
  const body = {
    ref: 'main',
    inputs: {
      product_name: productName || '',
      rakuten_url: rakutenUrl || '',
      tiktok_url: tiktokUrl || '',
      image_filename: imageFilename || '',
      display_order: displayOrder || ''
    }
  };
  const resp = await fetch(`${REPO_API}/actions/workflows/sync.yml/dispatches`, {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok && resp.status !== 204) throw new Error(`Sync trigger failed: ${resp.status}`);
}

// Submit
async function submit() {
  const name = selectedProduct;
  const url = document.getElementById('rakutenUrl').value.trim();
  const tiktok = document.getElementById('tiktokUrl').value.trim();
  const order = document.getElementById('displayOrder').value.trim();

  if (!name) { showStatus('商品を選択してください', 'error'); return; }
  if (!url && !tiktok && !selectedFile && !order) { showStatus('URL・画像・表示順のどれかを入力してください', 'error'); return; }
  if (order && order !== 'clear' && isNaN(Number(order))) { showStatus('表示順は数字か clear を入れてください', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  showStatus('送信中...', 'loading');

  try {
    let imageFilename = '';
    if (selectedFile) {
      showStatus('画像アップロード中...', 'loading');
      imageFilename = await uploadImage(name, selectedFile);
    }

    showStatus('同期トリガー中...', 'loading');
    await triggerSync(name, url, tiktok, imageFilename, order);

    showStatus('送信完了！ 1〜2分でカタログに反映されます。', 'success');
    selectedFile = null;
    dz.classList.remove('has-file');
    dz.innerHTML = 'タップして画像を選択<br>またはドラッグ＆ドロップ';
    document.getElementById('rakutenUrl').value = '';
    document.getElementById('tiktokUrl').value = '';
    document.getElementById('displayOrder').value = '';
    clearSelection();

  } catch (e) {
    showStatus('エラー: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

// Sync only (no image/url update)
async function syncOnly() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  showStatus('同期トリガー中...', 'loading');
  try {
    await triggerSync('', '', '', '');
    showStatus('同期開始！ 1〜2分でカタログに反映されます。', 'success');
  } catch (e) {
    showStatus('エラー: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
